[project]
name = "pmda-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # PMDA agent
    "pydantic>=2.0",
    "mcp>=1.0",
    "httpx>=0.27",
    # LLM Gateway V3
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    "jsonschema>=4.21",
    # MCP server dependencies
    "ddgs>=9.0",
    "tavily-python>=0.5",
    "crawl4ai>=0.4",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat-module layout — include all root-level .py scripts
include = [
    "schemas.py",
    "action.py",
    "memory.py",
    "perception.py",
    "decision.py",
    "agent6.py",
    "simulate_agent5_failure.py",
]

[tool.uv]
dev-dependencies = []
